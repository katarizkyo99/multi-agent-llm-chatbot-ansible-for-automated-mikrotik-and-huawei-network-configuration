- name: Read data from network device
  hosts: all
  gather_facts: no

  tasks:
    # 1. MIKROTIK
    - name: Run command on Mikrotik
      community.routeros.command:
        commands: "{{ target_command }}"
      when: ansible_network_os == "community.routeros.routeros"
      register: mikrotik_out

    # 2. HUAWEI CE
    - name: Run command on Huawei CE
      community.network.ce_command:
        commands: "{{ target_command }}"
      when: ansible_network_os == "community.network.ce"
      register: ce_out

    # 3. HUAWEI VRP (Gunakan modul universal)
    - name: Run command on Huawei VRP
      ansible.netcommon.cli_command:
        command: "{{ target_command }}"  # <--- Perhatikan: Tanpa 's' di belakangnya
      when: ansible_network_os == "community.network.vrp"
      register: vrp_out

    # 4. TAMPILKAN HASILNYA KE STDOUT
    - name: "Output Eksekusi"
      debug:
        msg: >
          {% if ansible_network_os == 'community.routeros.routeros' %}
          {{ mikrotik_out.stdout[0] | default('Tidak ada output') }}
          {% elif ansible_network_os == 'community.network.ce' %}
          {{ ce_out.stdout[0] | default(ce_out.stdout | default('Tidak ada output')) }}
          {% elif ansible_network_os == 'community.network.vrp' %}
          {{ vrp_out.stdout | default('Tidak ada output') }}
          {% endif %}
