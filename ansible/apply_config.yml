- name: Apply config to network device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply config to Mikrotik RouterOs
      community.routeros.command:
        commands: "{{ config_cli }}"
      when: ansible_network_os == "community.routeros.routeros"
      register: mikrotik_result  
      
      failed_when: 
        - mikrotik_result.failed == true or
          "bad command" in (mikrotik_result | string | lower) or
          "syntax error" in (mikrotik_result | string | lower) or
          "expected end" in (mikrotik_result | string | lower) or
          "input does not match" in (mikrotik_result | string | lower) or
          "no such item" in (mikrotik_result | string | lower)

    - name: Apply config to Huawei
      ansible.netcommon.cli_config:
        config: "{{ config_cli }}"
      when: ansible_network_os == 'community.network.ce'
      become: yes
      register: huawei_result
      
      failed_when:
        - huawei_result.failed == true or
          "unrecognized command" in (huawei_result | string | lower) or
          "wrong parameter" in (huawei_result | string | lower) or
          "error:" in (huawei_result | string | lower) or
          "incomplete command" in (huawei_result | string | lower) or
          "ambiguous command" in (huawei_result | string | lower)
