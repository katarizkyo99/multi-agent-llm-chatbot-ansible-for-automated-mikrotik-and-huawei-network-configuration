- name: Apply config to network device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply config to Mikrotik RouterOs
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ config_cli.split('\n') }}"
      when: ansible_network_os == "community.routeros.routeros" and item | trim != ''
      register: mikrotik_result
      ignore_errors: yes
      failed_when: "'expected' in (mikrotik_result.stdout | default('')) or 'bad command' in (mikrotik_result.stdout | default(''))"
      changed_when: "'expected' not in (mikrotik_result.stdout | default('')) and 'bad command' not in (mikrotik_result.stdout | default(''))"
      

    - name: Apply config to Huawei
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ ['system-view'] + config_cli.split('\n') + ['return'] }}"
      when: ansible_network_os == 'community.network.ce' and item | trim != ''
      register: huawei_result
      ignore_errors: yes
      
    - name: "Tampilkan Hasil Eksekusi Perangkat"
      debug:
        msg: 
          - "=== OUTPUT MIKROTIK ==="
          - "{{ mikrotik_result.results | default([]) | map(attribute='stdout') | list | default('N/A') }}"
          - "=== OUTPUT HUAWEI ==="
          - "{{ huawei_result.results | map(attribute='stdout') | list | default('N/A') }}"
