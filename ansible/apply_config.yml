---
- name: Apply config to network device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply config to Mikrotik RouterOs
      community.routeros.command:
        commands: "{{ config_cli.split(';') | reject('match', '^\\s*$') | list }}"
      when: ansible_network_os == "community.routeros.routeros" and config_cli | trim != ''
      register: mikrotik_result  
      ignore_errors: yes

      failed_when: >
        'bad command' in (mikrotik_result.stdout | default([]) | join(' ') | lower) or
        'syntax error' in (mikrotik_result.stdout | default([]) | join(' ') | lower) or
        'expected end' in (mikrotik_result.stdout | default([]) | join(' ') | lower) or
        'input does not match' in (mikrotik_result.stdout | default([]) | join(' ') | lower) or
        'no such item' in (mikrotik_result.stdout | default([]) | join(' ') | lower)

      changed_when: >
        'bad command' not in (mikrotik_result.stdout | default([]) | join(' ') | lower) and
        'syntax error' not in (mikrotik_result.stdout | default([]) | join(' ') | lower) and
        'expected end' not in (mikrotik_result.stdout | default([]) | join(' ') | lower) and
        'input does not match' not in (mikrotik_result.stdout | default([]) | join(' ') | lower) and
        'no such item' not in (mikrotik_result.stdout | default([]) | join(' ') | lower)
          
    - name: Apply config to Huawei
      community.network.ce_command:
        commands: "{{ ['system-view'] + config_cli.split('\n') | reject('match', '^\\s*$') | list + ['return'] }}"
      when: ansible_network_os == 'community.network.ce' and config_cli | trim != ''
      register: huawei_result
      ignore_errors: yes
      
      failed_when: >
        huawei_result.failed == true or
        "Error:" in (huawei_result.stdout | default([]) | join(' ') | string) or
        "Unrecognized" in (huawei_result.stdout | default([]) | join(' ') | string)
        
      changed_when: >
        huawei_result.failed == false and
        "Error:" not in (huawei_result.stdout | default([]) | join(' ') | string) and
        "Unrecognized" not in (huawei_result.stdout | default([]) | join(' ') | string)
      
    - name: Tampilkan Hasil Eksekusi Perangkat
      debug:
        msg: 
          - "=== OUTPUT MIKROTIK ==="
          - "{{ mikrotik_result.stdout | default('N/A') }}"
          - "=== OUTPUT HUAWEI ==="
          - "{{ huawei_result.stdout | default('N/A') }}"
