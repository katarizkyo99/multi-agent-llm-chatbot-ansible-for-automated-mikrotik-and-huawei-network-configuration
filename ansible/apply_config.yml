- name: Apply config to network device
  hosts: all
  gather_facts: no

  tasks:
    - name: Apply config to Mikrotik RouterOs
      community.routeros.command:
        # Pecah kembali string yang digabung " ; " dari backend menjadi list
        commands: "{{ config_cli.split(' ; ') }}"
      when: ansible_network_os == "community.routeros.routeros"
      register: mikrotik_result  
      ignore_errors: yes

      # Deteksi Error (Merah) menggunakan YAML multi-line (>)
      failed_when: >
        mikrotik_result.failed == true or
        "bad command" in (mikrotik_result | string | lower) or
        "syntax error" in (mikrotik_result | string | lower) or
        "expected end" in (mikrotik_result | string | lower) or
        "input does not match" in (mikrotik_result | string | lower) or
        "no such item" in (mikrotik_result | string | lower)
        
      # Deteksi Berubah (Kuning) HANYA jika tidak ada satupun error di atas
      changed_when: >
        mikrotik_result.failed == false and
        "bad command" not in (mikrotik_result | string | lower) and
        "syntax error" not in (mikrotik_result | string | lower) and
        "expected end" not in (mikrotik_result | string | lower) and
        "input does not match" not in (mikrotik_result | string | lower) and
        "no such item" not in (mikrotik_result | string | lower)
          
    - name: Apply config to Huawei
      ansible.netcommon.cli_command:
        command: "{{ item }}"
      loop: "{{ ['system-view'] + config_cli.split('\n') + ['return'] }}"
      when: ansible_network_os == 'community.network.ce' and item | trim != ''
      register: huawei_result
      ignore_errors: yes
      
    - name: "Tampilkan Hasil Eksekusi Perangkat"
      debug:
        msg: 
          - "=== OUTPUT MIKROTIK ==="
          - "{{ mikrotik_result.results | default([]) | map(attribute='stdout') | list | default('N/A') }}"
          - "=== OUTPUT HUAWEI ==="
          - "{{ huawei_result.results | map(attribute='stdout') | list | default('N/A') }}"
