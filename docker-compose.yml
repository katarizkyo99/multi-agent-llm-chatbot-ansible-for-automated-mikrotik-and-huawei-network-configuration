

services:
  r-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: r-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - ta-network
    depends_on:
      - ta-postgres
      

  r-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: r-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app

    networks:
      - ta-network
    depends_on:
      - r-backend


  r-ansible:
    build:
      context: ./ansible
      dockerfile: Dockerfile
    container_name: r-ansible
    volumes:
      - ./ansible:/ansible
    networks:
      - ta-network

  ta-postgres:
    image: postgres:17
    container_name: ta-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ta
    volumes:
      - ./postgres-data:/var/lib/postgresql  
    ports:
      - "5432:5432"
    networks:
      - ta-network


networks:
  ta-network:
    driver: bridge

volumes:
  postgres_data:
